<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>brumbrum</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#161616" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="brumbrum" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 1. entrada: nombre + contraseña del club -->
  <section id="entrada" class="view" hidden>
    <div class="k">chat anónimo por salas · meowrhino.studio</div>
    <div class="title">brumbrum<i></i></div>
    <div class="dots" id="dots"></div>
    <!-- la moto negra, sin faro, encima de la carretera -->
    <div class="road"><svg class="moto" viewBox="0 0 140 70" aria-hidden="true">
      <g class="wheel"><circle cx="28" cy="52" r="14"/><path d="M28 38v28M14 52h28"/></g>
      <g class="wheel"><circle cx="112" cy="52" r="14"/><path d="M112 38v28M98 52h28"/></g>
      <path class="body" d="M30 50 44 30 70 24 92 26 104 38 110 52 88 52 80 44 50 44 42 52z"/>
      <path d="M92 26 98 16h8M44 50h32" fill="none"/>
      <rect class="tail" x="36" y="31" width="5" height="3"/>
    </svg></div>
    <form id="login" autocomplete="off">
      <label class="k" for="name">nombre</label><input id="name" maxlength="25" required autocomplete="username" />
      <label class="k" for="password">tu contraseña</label><input id="password" type="password" minlength="4" required autocomplete="current-password" />
      <label class="k" for="club">password del club</label><input id="club" type="password" required autocomplete="off" />
      <span></span><button type="submit">entrar →</button>
      <span></span><span id="login-error" class="err"></span>
    </form>
  </section>

  <!-- 2. lobby: salas y cuánta gente hay -->
  <section id="lobby" class="view" hidden>
    <header class="top">
      <span class="title small">brumbrum<i></i></span>
      <span class="k"><a href="#" id="edit-avatar" class="me-chip"><span class="avatar mini" id="me-avatar"></span><b id="me-lobby"></b></a> · <a href="#" id="logout">salir</a></span>
    </header>
    <div class="road"></div>
    <ul id="rooms" class="rooms"></ul>
    <form id="goto" class="goto" autocomplete="off">
      <label class="k" for="room-name">otra sala</label>
      <input id="room-name" placeholder="nombre-de-sala" pattern="[a-z0-9_-]{1,32}" maxlength="32" required />
      <button type="submit">ir →</button>
    </form>
  </section>

  <!-- 2b. tu avatar: capas + color -->
  <section id="avatar" class="view" hidden>
    <header class="top"><span class="title small">tu avatar</span><span class="k" id="avatar-name"></span></header>
    <div class="editor">
      <div class="stage">
        <div class="avatar big" id="preview"></div>
        <div class="stage-tools">
          <input type="color" id="avatar-color" class="swatch" title="tu color" />
          <button type="button" id="random-avatar">al azar</button>
          <button type="button" id="save-avatar">listo →</button>
        </div>
      </div>
      <div class="panels">
        <nav class="tabs" id="tabs"></nav>
        <div id="chips"></div>
      </div>
    </div>
    <details class="pw">
      <summary class="k">cambiar contraseña</summary>
      <form id="pwform" autocomplete="off">
        <input id="pw-current" type="password" placeholder="la actual" autocomplete="current-password" required />
        <input id="pw-next" type="password" placeholder="la nueva (4+)" minlength="4" autocomplete="new-password" required />
        <button type="submit">cambiar</button>
        <span class="k" id="pw-msg"></span>
      </form>
    </details>
  </section>

  <!-- 3. sala: avatares + burbujas, estilo clip de Live -->
  <section id="sala" class="view" hidden>
    <header class="top">
      <a href="#" id="back" class="k">← salas</a>
      <span>#<b id="room"></b> <span class="k" id="count"></span></span>
      <span class="tools">
        <span id="presence" class="presence"></span>
        <input type="color" id="mycolor" class="swatch" title="tu color" />
        <button id="mute" class="iconbtn" type="button">🔔</button>
      </span>
    </header>
    <ul id="messages"></ul>
    <div id="typing" class="k" aria-live="polite"></div>
    <form id="composer" autocomplete="off">
      <input id="body" type="text" placeholder="escribe…" maxlength="1000" />
      <button type="submit">enviar</button>
    </form>
  </section>

  <script type="module" src="/js/main.js"></script>
  <script>
    if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  </script>
</body>
</html>
