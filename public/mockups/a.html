<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>brumbrum — A: Dollars negro</title>
<style>
@font-face{font-family:'JetBrains Mono';src:url('/fonts/jetbrains-mono-400.woff2') format('woff2');font-weight:400}
@font-face{font-family:'JetBrains Mono';src:url('/fonts/jetbrains-mono-600.woff2') format('woff2');font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#ddd;font:14px/1.5 'JetBrains Mono',monospace}
section{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px}
h2.tag{position:fixed;top:12px;left:16px;font-size:11px;color:#555;letter-spacing:.2em;text-transform:uppercase}
/* --- entrada: anillo doble neón que gira despacio ------------------------ */
.ring{position:relative;width:min(70vw,360px);aspect-ratio:1;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring circle{fill:none;stroke:#fff}
.ring .outer{stroke-width:1.5;opacity:.6;stroke-dasharray:3 2}
.ring .inner{stroke-width:7}
.ring::before{content:'';position:absolute;inset:8%;border-radius:50%;box-shadow:0 0 14px 4px rgba(255,255,255,.55),inset 0 0 14px 4px rgba(255,255,255,.55)}
.logo{font-size:clamp(28px,7vw,46px);letter-spacing:.14em;font-weight:600;display:flex}
/* cada letra = malla de puntos en el color de alguien conectado */
.logo span{color:transparent;background:radial-gradient(circle,var(--c) 1.6px,transparent 2px) 0 0/5px 5px;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 2px var(--c))}
form{display:flex;flex-direction:column;align-items:center;gap:14px}
label{display:flex;align-items:center;gap:10px;font-size:12px;color:#bbb;letter-spacing:.15em}
input{width:220px;height:28px;border:0;border-radius:14px;background:#fff;color:#000;padding:0 12px;font:inherit}
button{width:220px;height:30px;border:1px solid #444;background:#111;color:#ddd;font:inherit;letter-spacing:.2em;cursor:pointer}
button:hover{background:#222;border-color:#fff}
/* --- chat: avatar cuadrado + burbuja con pico, ambos en el color ---------- */
.chat{width:min(100%,640px);display:flex;flex-direction:column;gap:14px;align-self:center}
.m{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start}
.m.me{direction:rtl}.m.me>*{direction:ltr}
.av{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#bbb}
.av .sq{width:52px;height:52px;background:var(--c);color:#fff;padding:7px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.av svg{width:100%;height:100%}
.b{position:relative;justify-self:start;max-width:80%;padding:10px 16px;border-radius:12px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35);
  background:linear-gradient(var(--c) 0 50%,color-mix(in srgb,var(--c) 80%,#000) 50% 100%);border:2px solid rgba(255,255,255,.7)}
.b::before{content:'';position:absolute;top:18px;left:-12px;border:6px solid transparent;border-right-color:rgba(255,255,255,.7);border-left:0}
.m.me .b::before{left:auto;right:-12px;transform:scaleX(-1)}
.sys{text-align:center;font-size:11px;color:#666}
.bar{display:flex;gap:8px;width:min(100%,640px)}
.bar input{flex:1;border-radius:4px;background:#111;color:#fff;border:1px solid #333;height:36px}
.bar button{width:auto;padding:0 18px;height:36px}
</style></head><body>
<h2 class="tag">A · dollars negro</h2>
<section>
  <div class="ring">
    <svg viewBox="0 0 100 100"><circle class="outer" cx="50" cy="50" r="48"/><circle class="inner" cx="50" cy="50" r="42"/></svg>
    <div class="logo" id="logo"></div>
  </div>
  <form onsubmit="return false"><label>PASSWORD: <input type="password"></label><button>ENTER</button></form>
</section>
<section>
  <div class="chat" id="chat"></div>
  <div class="bar"><input placeholder="escribe…"><button>enviar</button></div>
</section>
<script type="module">
import {USERS,MSGS,svg} from './_shared.js';
const cols=Object.values(USERS).map(u=>u.color);
logo.innerHTML=[...'BRUMBRUM'].map((l,i)=>`<span style="--c:${cols[i%cols.length]}">${l}</span>`).join('');
chat.innerHTML=MSGS.map(m=>m[0]==='sys'?`<div class="sys">${m[1]} ${m[2]}</div>`:
 `<div class="m ${m[0]==='yo'?'me':''}" style="--c:${USERS[m[0]].color}"><div class="av"><div class="sq">${svg(USERS[m[0]].ico)}</div>${m[0]}</div><div class="b">${m[1]}</div></div>`).join('');
</script></body></html>
