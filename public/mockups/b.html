<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>brumbrum — B: Ableton + burbujas</title>
<style>
@font-face{font-family:'JetBrains Mono';src:url('/fonts/jetbrains-mono-400.woff2') format('woff2');font-weight:400}
@font-face{font-family:'JetBrains Mono';src:url('/fonts/jetbrains-mono-500.woff2') format('woff2');font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#161616;--surface:#1e1e1e;--border:#333;--text:#d6d6d6;--dim:#9b9b9b;--muted:#676767;--ink:#141414}
body{background:var(--bg);color:var(--text);font:14px/1.6 'JetBrains Mono',monospace}
section{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:24px}
h2.tag{position:fixed;top:12px;left:16px;font-size:11px;color:#555;letter-spacing:.2em;text-transform:uppercase}
.k{font-size:10px;text-transform:lowercase;color:var(--muted);letter-spacing:.08em}
/* --- entrada: la carretera (una línea) y el nombre encima ----------------- */
.road{position:relative;width:100%;height:1px;background:#fff;margin:40px 0}
.road::after{content:'';position:absolute;left:0;right:0;top:-3px;height:1px;background:repeating-linear-gradient(90deg,#fff 0 24px,transparent 24px 48px);opacity:.4;animation:drive 1.2s linear infinite}
@keyframes drive{to{background-position:-48px 0}}
.title{font-size:clamp(28px,6vw,44px);font-weight:500;letter-spacing:-.02em;line-height:1}
.title i{font-style:normal;display:inline-block;width:.28em;height:.28em;margin-left:.15em;background:var(--dot,#c0c0c0);vertical-align:baseline}
.dots{display:flex;gap:3px;margin-top:10px}.dots b{width:8px;height:8px;background:var(--c)}
form{display:grid;grid-template-columns:max-content 1fr max-content;gap:12px;align-items:center;max-width:520px}
input{height:32px;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);font:inherit;padding:0 4px}
input:focus{outline:0;border-color:#fff}
button{border:0;background:transparent;color:var(--dim);font:inherit;cursor:pointer;padding:0}button:hover{color:#fff}
/* --- chat: bloques rectos, color = clip de Live, texto oscuro encima ------ */
.room{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:8px}
.room .on span{display:inline-block;width:8px;height:8px;margin-left:6px;background:var(--c)}
.chat{display:flex;flex-direction:column;gap:10px;max-width:720px}
.m{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.m.me{grid-template-columns:1fr 40px}.m.me .av{order:2}.m.me .b{justify-self:end}
.av{width:40px;height:40px;background:var(--c);color:var(--ink);padding:6px}
.av svg{width:100%;height:100%}
.b{justify-self:start;max-width:78%;background:var(--c);color:var(--ink);padding:8px 12px}
.b small{display:block;font-size:10px;opacity:.65;margin-bottom:2px}
.sys{font-size:10px;color:var(--muted);padding-left:50px}
.bar{display:flex;gap:12px;max-width:720px;border-top:1px solid var(--border);padding-top:12px}
.bar input{flex:1;border:0}
</style></head><body>
<h2 class="tag">B · ableton + burbujas</h2>
<section>
  <div class="k">chat anónimo por salas · meowrhino.studio</div>
  <div class="title">brumbrum<i></i></div>
  <div class="dots" id="dots"></div>
  <div class="road"></div>
  <form onsubmit="return false"><span class="k">password</span><input type="password"><button>entrar →</button></form>
</section>
<section>
  <div class="room"><span>#puente <span class="k">· 4 en línea</span></span><span class="on" id="on"></span></div>
  <div class="chat" id="chat"></div>
  <div class="bar"><input placeholder="escribe…"><button>enviar</button></div>
</section>
<script type="module">
import {USERS,MSGS,svg} from './_shared.js';
const cols=Object.values(USERS).map(u=>u.color);
dots.innerHTML=cols.map(c=>`<b style="--c:${c}"></b>`).join('');
on.innerHTML=Object.keys(USERS).map(n=>`<span style="--c:${USERS[n].color}" title="${n}"></span>`).join('');
chat.innerHTML=MSGS.map(m=>m[0]==='sys'?`<div class="sys">${m[1]} ${m[2]}</div>`:
 `<div class="m ${m[0]==='yo'?'me':''}" style="--c:${USERS[m[0]].color}"><div class="av">${svg(USERS[m[0]].ico)}</div><div class="b"><small>${m[0]} · 03:12</small>${m[1]}</div></div>`).join('');
</script></body></html>
